[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-icb"
version = "0.1.0"
description = "Cell-state-resolved and perturbation-aware framework for ICB resistance analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "openpyxl",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "xenaPython",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
