[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-icb"
version = "0.1.0"
description = "NMF-based discovery of malignant cell states associated with immune checkpoint blockade resistance"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "openpyxl",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "xenaPython",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
# Figures and docx for the manuscript (scripts 40 and 41)
manuscript = [
  "matplotlib",
  "seaborn",
  "python-docx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
